<!doctype html>
<html lang="--LANG--">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>--TITLE--</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@600&family=Nunito:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      img {
        border: none;
        -ms-interpolation-mode: bicubic;
        max-width: 100%;
      }

      body {
        background-color: #f3f8f7;
        font-family: Nunito, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
        padding: 0;
        -ms-text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
      }

      table {
        border-collapse: separate;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
        width: 100%;
      }

      table td {
        font-family: Nunito, Helvetica, Arial, sans-serif;
        font-size: 16px;
        vertical-align: top;
      }

      .body {
        background-color: #f3f8f7;
        width: 100%;
      }

      .container {
        display: block;
        margin: 0 auto !important;
        max-width: 580px;
        padding: 10px;
        width: 580px;
      }

      .content {
        box-sizing: border-box;
        display: block;
        margin: 0 auto;
        max-width: 580px;
        padding: 10px;
      }

      .main {
        background: #ffffff;
        border-radius: 12px;
        width: 100%;
      }

      .wrapper {
        box-sizing: border-box;
        padding: 32px 28px;
      }

      .header {
        background-color: #155e63;
        border-radius: 12px 12px 0 0;
        padding: 24px 28px;
        text-align: center;
      }

      .brand-lockup {
        margin: 0 auto;
        width: auto;
      }

      .brand {
        color: #ffffff;
        font-family: "Albert Sans", Nunito, Helvetica, Arial, sans-serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.05em;
        line-height: 1;
        margin: 0;
        text-decoration: none;
      }

      .content-block {
        padding-bottom: 10px;
        padding-top: 10px;
      }

      .footer {
        clear: both;
        margin-top: 10px;
        text-align: center;
        width: 100%;
      }

      .footer td,
      .footer p,
      .footer span,
      .footer a {
        color: #6b8280;
        font-size: 12px;
        text-align: center;
      }

      h1 {
        color: #12292c;
        font-family: Nunito, Helvetica, Arial, sans-serif;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.3;
        margin: 0 0 16px 0;
      }

      p {
        font-family: Nunito, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: normal;
        color: #2c4544;
        margin: 0 0 16px 0;
      }

      a {
        color: #0f766e;
        text-decoration: underline;
      }

      .btn {
        box-sizing: border-box;
        width: 100%;
      }

      .btn > tbody > tr > td {
        padding-bottom: 16px;
      }

      .btn table {
        width: auto;
      }

      .btn table td {
        background-color: #0f9488;
        border-radius: 999px;
        text-align: center;
      }

      .btn-primary a {
        background-color: #0f9488;
        border: solid 1px #0f9488;
        border-radius: 999px;
        box-sizing: border-box;
        color: #ffffff;
        cursor: pointer;
        display: inline-block;
        font-size: 16px;
        font-weight: bold;
        margin: 0;
        padding: 14px 28px;
        text-decoration: none;
      }

      .fallback-url {
        word-break: break-all;
        font-size: 13px;
        color: #546665;
      }

      .preheader {
        color: transparent;
        display: none;
        height: 0;
        max-height: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        mso-hide: all;
        visibility: hidden;
        width: 0;
      }

      @media only screen and (max-width: 620px) {
        table[class="body"] h1 {
          font-size: 22px !important;
          margin-bottom: 12px !important;
        }
        table[class="body"] p,
        table[class="body"] td,
        table[class="body"] span,
        table[class="body"] a {
          font-size: 16px !important;
        }
        table[class="body"] .wrapper {
          padding: 20px !important;
        }
        table[class="body"] .content {
          padding: 0 !important;
        }
        table[class="body"] .container {
          padding: 0 !important;
          width: 100% !important;
        }
        table[class="body"] .main {
          border-radius: 0 !important;
        }
        table[class="body"] .header {
          border-radius: 0 !important;
        }
        table[class="body"] .btn table {
          width: 100% !important;
        }
        table[class="body"] .btn-primary a {
          width: 100% !important;
        }
      }

      @media all {
        .ExternalClass {
          width: 100%;
        }
        .ExternalClass,
        .ExternalClass p,
        .ExternalClass span,
        .ExternalClass font,
        .ExternalClass td,
        .ExternalClass div {
          line-height: 100%;
        }
        .apple-link a {
          color: inherit !important;
          font-family: inherit !important;
          font-size: inherit !important;
          font-weight: inherit !important;
          line-height: inherit !important;
          text-decoration: none !important;
        }
        #MessageViewBody a {
          color: inherit;
          text-decoration: none;
          font-size: inherit;
          font-family: inherit;
          font-weight: inherit;
          line-height: inherit;
        }
        .btn-primary table td:hover {
          background-color: #0f766e !important;
        }
        .btn-primary a:hover {
          background-color: #0f766e !important;
          border-color: #0f766e !important;
        }
      }
    </style>
  </head>
  <body>
    <span class="preheader">--PREHEADER--</span>
    <table
      role="presentation"
      border="0"
      cellpadding="0"
      cellspacing="0"
      class="body"
    >
      <tr>
        <td>&nbsp;</td>
        <td class="container">
          <div class="content">
            <table role="presentation" class="main">
              <tr>
                <td class="header" align="center">
                  <table
                    role="presentation"
                    border="0"
                    cellpadding="0"
                    cellspacing="0"
                    class="brand-lockup"
                    align="center"
                  >
                    <tr>
                      <td
                        style="padding-right: 8px; vertical-align: middle; line-height: 0"
                      >
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          width="28"
                          height="28"
                          viewBox="0 0 64 64"
                          fill="#ffffff"
                          aria-hidden="true"
                        >
                          <g transform="rotate(15 32 32) translate(0 -3)">
                            <rect x="30" y="3" width="4" height="27" rx="2" />
                            <path d="M23 28h18l3 9H20z" />
                            <path d="M20.5 36h5l-7 18a3.5 3.5 0 0 1-7 0z" />
                            <path d="M25 36h5l-2.5 21a3.5 3.5 0 0 1-7 0z" />
                            <path d="M29.5 36h5l1 22a3.5 3.5 0 0 1-7 0z" />
                            <path d="M34 36h5l4.5 21a3.5 3.5 0 0 1-7 0z" />
                            <path d="M38.5 36h5l8.5 18a3.5 3.5 0 0 1-7 0z" />
                          </g>
                        </svg>
                      </td>
                      <td style="vertical-align: middle">
                        <p class="brand">linpura</p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td class="wrapper">
                  <table
                    role="presentation"
                    border="0"
                    cellpadding="0"
                    cellspacing="0"
                  >
                    <tr>
                      <td>
                        <h1>--HEADING--</h1>
                        <p>--GREETING--</p>
                        <p>--BODY--</p>
                        <table
                          role="presentation"
                          border="0"
                          cellpadding="0"
                          cellspacing="0"
                          class="btn btn-primary"
                        >
                          <tbody>
                            <tr>
                              <td align="left">
                                <table
                                  role="presentation"
                                  border="0"
                                  cellpadding="0"
                                  cellspacing="0"
                                >
                                  <tbody>
                                    <tr>
                                      <td>
                                        <a href="--URL--" target="_blank"
                                          >--CTA--</a
                                        >
                                      </td>
                                    </tr>
                                  </tbody>
                                </table>
                              </td>
                            </tr>
                          </tbody>
                        </table>
                        <p class="fallback-url">
                          --FALLBACK--<br />
                          <a href="--URL--" target="_blank">--URL--</a>
                        </p>
                        <p>--EXPIRY--</p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <div class="footer">
              <table
                role="presentation"
                border="0"
                cellpadding="0"
                cellspacing="0"
              >
                <tr>
                  <td class="content-block">
                    <span class="apple-link">Linpura</span>
                    <br />
                    <a href="https://linpura.com" target="_blank">linpura.com</a>
                    &nbsp;·&nbsp;
                    <a href="mailto:support@linpura.com">support@linpura.com</a>
                  </td>
                </tr>
              </table>
            </div>
          </div>
        </td>
        <td>&nbsp;</td>
      </tr>
    </table>
  </body>
</html>
