<!doctype html>
<html lang="--LANG--">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>--TITLE--</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@600&family=Nunito:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f3f8f7;
        font-family: Nunito, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
        padding: 0;
      }

      table {
        border-collapse: separate;
        width: 100%;
      }

      table td {
        font-family: Nunito, Helvetica, Arial, sans-serif;
        font-size: 16px;
        vertical-align: top;
      }

      .body {
        background-color: #f3f8f7;
        width: 100%;
      }

      .container {
        display: block;
        margin: 0 auto !important;
        max-width: 580px;
        padding: 10px;
        width: 580px;
      }

      .content {
        box-sizing: border-box;
        display: block;
        margin: 0 auto;
        max-width: 580px;
        padding: 10px;
      }

      .main {
        background: #ffffff;
        border-radius: 12px;
        width: 100%;
      }

      .wrapper {
        box-sizing: border-box;
        padding: 32px 28px;
      }

      .header {
        background-color: #155e63;
        border-radius: 12px 12px 0 0;
        padding: 24px 28px;
        text-align: center;
      }

      .brand-lockup {
        margin: 0 auto;
        width: auto;
      }

      .brand {
        color: #ffffff;
        font-family: "Albert Sans", Nunito, Helvetica, Arial, sans-serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.05em;
        line-height: 1;
        margin: 0;
        text-decoration: none;
      }

      .footer {
        clear: both;
        margin-top: 10px;
        text-align: center;
        width: 100%;
      }

      .footer td,
      .footer p,
      .footer span,
      .footer a {
        color: #6b8280;
        font-size: 12px;
        text-align: center;
      }

      h1 {
        color: #12292c;
        font-family: Nunito, Helvetica, Arial, sans-serif;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.3;
        margin: 0 0 16px 0;
      }

      p {
        font-family: Nunito, Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: normal;
        color: #2c4544;
        margin: 0 0 16px 0;
      }

      a {
        color: #0f766e;
        text-decoration: underline;
      }

      .btn {
        box-sizing: border-box;
        width: 100%;
      }

      .btn > tbody > tr > td {
        padding-bottom: 16px;
      }

      .btn table {
        width: auto;
      }

      .btn table td {
        background-color: #0f9488;
        border-radius: 999px;
        text-align: center;
      }

      .btn-primary a {
        background-color: #0f9488;
        border: solid 1px #0f9488;
        border-radius: 999px;
        box-sizing: border-box;
        color: #ffffff;
        cursor: pointer;
        display: inline-block;
        font-size: 16px;
        font-weight: bold;
        margin: 0;
        padding: 14px 28px;
        text-decoration: none;
      }

      .preheader {
        color: transparent;
        display: none;
        height: 0;
        max-height: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        mso-hide: all;
        visibility: hidden;
        width: 0;
      }

      @media only screen and (max-width: 620px) {
        table[class="body"] .wrapper {
          padding: 20px !important;
        }
        table[class="body"] .container {
          padding: 0 !important;
          width: 100% !important;
        }
        table[class="body"] .main,
        table[class="body"] .header {
          border-radius: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <span class="preheader">--PREHEADER--</span>
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" class="body">
      <tr>
        <td>&nbsp;</td>
        <td class="container">
          <div class="content">
            <table role="presentation" class="main">
              <tr>
                <td class="header" align="center">
                  <table
                    role="presentation"
                    border="0"
                    cellpadding="0"
                    cellspacing="0"
                    class="brand-lockup"
                    align="center"
                  >
                    <tr>
                      <td
                        style="padding-right: 8px; vertical-align: middle; line-height: 0"
                      >
                        <img
                          src="cid:linpura-icon.png"
                          width="28"
                          height="28"
                          alt="Linpura"
                          style="display: block; border: 0; width: 28px; height: 28px;"
                        />
                      </td>
                      <td style="vertical-align: middle">
                        <p class="brand">linpura</p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              <tr>
                <td class="wrapper">
                  <h1>--HEADING--</h1>
                  <p>--GREETING--</p>
                  --BODY--
                  --CTA_BLOCK--
                </td>
              </tr>
            </table>
            <div class="footer">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <span>Linpura</span>
                    <br />
                    <a href="https://linpura.com" target="_blank">linpura.com</a>
                  </td>
                </tr>
              </table>
            </div>
          </div>
        </td>
        <td>&nbsp;</td>
      </tr>
    </table>
  </body>
</html>
