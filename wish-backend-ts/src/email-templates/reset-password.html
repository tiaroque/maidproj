<!doctype html>
<html lang="--LANG--">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>--TITLE--</title>
    <style>
      img {
        border: none;
        -ms-interpolation-mode: bicubic;
        max-width: 100%;
      }

      body {
        background-color: #f4eef0;
        font-family: Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
        padding: 0;
        -ms-text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
      }

      table {
        border-collapse: separate;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
        width: 100%;
      }

      table td {
        font-family: Helvetica, Arial, sans-serif;
        font-size: 16px;
        vertical-align: top;
      }

      .body {
        background-color: #f4eef0;
        width: 100%;
      }

      .container {
        display: block;
        margin: 0 auto !important;
        max-width: 580px;
        padding: 10px;
        width: 580px;
      }

      .content {
        box-sizing: border-box;
        display: block;
        margin: 0 auto;
        max-width: 580px;
        padding: 10px;
      }

      .main {
        background: #ffffff;
        border-radius: 12px;
        width: 100%;
      }

      .wrapper {
        box-sizing: border-box;
        padding: 32px 28px;
      }

      .header {
        background-color: #b44a6a;
        border-radius: 12px 12px 0 0;
        padding: 24px 28px;
        text-align: center;
      }

      .brand {
        color: #ffffff;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.04em;
        margin: 0;
        text-decoration: none;
      }

      .content-block {
        padding-bottom: 10px;
        padding-top: 10px;
      }

      .footer {
        clear: both;
        margin-top: 10px;
        text-align: center;
        width: 100%;
      }

      .footer td,
      .footer p,
      .footer span,
      .footer a {
        color: #9a7a82;
        font-size: 12px;
        text-align: center;
      }

      h1 {
        color: #301016;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.3;
        margin: 0 0 16px 0;
      }

      p {
        font-family: Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: normal;
        color: #4a353a;
        margin: 0 0 16px 0;
      }

      a {
        color: #b44a6a;
        text-decoration: underline;
      }

      .btn {
        box-sizing: border-box;
        width: 100%;
      }

      .btn > tbody > tr > td {
        padding-bottom: 16px;
      }

      .btn table {
        width: auto;
      }

      .btn table td {
        background-color: #b44a6a;
        border-radius: 8px;
        text-align: center;
      }

      .btn-primary a {
        background-color: #b44a6a;
        border: solid 1px #b44a6a;
        border-radius: 8px;
        box-sizing: border-box;
        color: #ffffff;
        cursor: pointer;
        display: inline-block;
        font-size: 16px;
        font-weight: bold;
        margin: 0;
        padding: 14px 28px;
        text-decoration: none;
      }

      .fallback-url {
        word-break: break-all;
        font-size: 13px;
        color: #7a5a62;
      }

      .preheader {
        color: transparent;
        display: none;
        height: 0;
        max-height: 0;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        mso-hide: all;
        visibility: hidden;
        width: 0;
      }

      @media only screen and (max-width: 620px) {
        table[class="body"] h1 {
          font-size: 22px !important;
          margin-bottom: 12px !important;
        }
        table[class="body"] p,
        table[class="body"] td,
        table[class="body"] span,
        table[class="body"] a {
          font-size: 16px !important;
        }
        table[class="body"] .wrapper {
          padding: 20px !important;
        }
        table[class="body"] .content {
          padding: 0 !important;
        }
        table[class="body"] .container {
          padding: 0 !important;
          width: 100% !important;
        }
        table[class="body"] .main {
          border-radius: 0 !important;
        }
        table[class="body"] .header {
          border-radius: 0 !important;
        }
        table[class="body"] .btn table {
          width: 100% !important;
        }
        table[class="body"] .btn-primary a {
          width: 100% !important;
        }
      }

      @media all {
        .ExternalClass {
          width: 100%;
        }
        .ExternalClass,
        .ExternalClass p,
        .ExternalClass span,
        .ExternalClass font,
        .ExternalClass td,
        .ExternalClass div {
          line-height: 100%;
        }
        .apple-link a {
          color: inherit !important;
          font-family: inherit !important;
          font-size: inherit !important;
          font-weight: inherit !important;
          line-height: inherit !important;
          text-decoration: none !important;
        }
        #MessageViewBody a {
          color: inherit;
          text-decoration: none;
          font-size: inherit;
          font-family: inherit;
          font-weight: inherit;
          line-height: inherit;
        }
        .btn-primary table td:hover {
          background-color: #8f3852 !important;
        }
        .btn-primary a:hover {
          background-color: #8f3852 !important;
          border-color: #8f3852 !important;
        }
      }
    </style>
  </head>
  <body>
    <span class="preheader">--PREHEADER--</span>
    <table
      role="presentation"
      border="0"
      cellpadding="0"
      cellspacing="0"
      class="body"
    >
      <tr>
        <td>&nbsp;</td>
        <td class="container">
          <div class="content">
            <table role="presentation" class="main">
              <tr>
                <td class="header">
                  <p class="brand">clara</p>
                </td>
              </tr>
              <tr>
                <td class="wrapper">
                  <table
                    role="presentation"
                    border="0"
                    cellpadding="0"
                    cellspacing="0"
                  >
                    <tr>
                      <td>
                        <h1>--HEADING--</h1>
                        <p>--GREETING--</p>
                        <p>--BODY--</p>
                        <table
                          role="presentation"
                          border="0"
                          cellpadding="0"
                          cellspacing="0"
                          class="btn btn-primary"
                        >
                          <tbody>
                            <tr>
                              <td align="left">
                                <table
                                  role="presentation"
                                  border="0"
                                  cellpadding="0"
                                  cellspacing="0"
                                >
                                  <tbody>
                                    <tr>
                                      <td>
                                        <a href="--URL--" target="_blank"
                                          >--CTA--</a
                                        >
                                      </td>
                                    </tr>
                                  </tbody>
                                </table>
                              </td>
                            </tr>
                          </tbody>
                        </table>
                        <p class="fallback-url">
                          --FALLBACK--<br />
                          <a href="--URL--" target="_blank">--URL--</a>
                        </p>
                        <p>--EXPIRY--</p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <div class="footer">
              <table
                role="presentation"
                border="0"
                cellpadding="0"
                cellspacing="0"
              >
                <tr>
                  <td class="content-block">
                    <span class="apple-link">Clara</span>
                    <br />
                    <a href="https://clara.com" target="_blank">clara.com</a>
                    &nbsp;·&nbsp;
                    <a href="mailto:support@clara.com">support@clara.com</a>
                  </td>
                </tr>
              </table>
            </div>
          </div>
        </td>
        <td>&nbsp;</td>
      </tr>
    </table>
  </body>
</html>
