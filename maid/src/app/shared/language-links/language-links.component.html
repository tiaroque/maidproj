<nav [class]="navClass()" aria-label="Languages">
  @for (lang of languages(); track lang.code) {
    <a
      (click)="clickedLink($event)"
      [href]="hrefFor(lang.code)"
      [hreflang]="lang.code"
      [lang]="lang.code"
      [class]="linkClass(lang.code)"
      [attr.aria-current]="isCurrent(lang.code) ? 'true' : null"
    >
      <app-flag [code]="lang.code" class="h-3.5 w-3.5" />
      <span class="truncate">{{ lang.name }}</span>
    </a>
  }
</nav>
