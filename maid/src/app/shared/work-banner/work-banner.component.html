@if (visible()) {
  <div class="verification-banner" role="status">
    <mat-icon class="verification-banner-icon" aria-hidden="true">
      {{ isCleaner() ? "cleaning_services" : "checklist" }}
    </mat-icon>

    <p class="verification-banner-text">
      {{ (isCleaner() ? "workBanner.cleaner" : "workBanner.client") | translate }}
    </p>

    <div class="verification-banner-actions">
      <a
        class="ad-btn verification-banner-cta"
        [routerLink]="['/', lang(), 'admin', 'profile']"
        fragment="work"
      >
        {{ "workBanner.cta" | translate }}
      </a>
      <button
        type="button"
        class="verification-banner-close"
        [attr.aria-label]="'verification.banner.dismiss' | translate"
        (click)="dismiss()"
      >
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </div>
  </div>
}
