<div class="mb-2">
  <div class="mb-3 flex items-center gap-2">
    <div
      class="min-w-0 flex-1 overflow-hidden rounded-lg border border-(--mat-sys-outline-variant) bg-[#eef6f4]"
      aria-hidden="true"
    >
      <div class="relative aspect-[372/72]">
        @if (image(); as svg) {
          <div
            class="absolute inset-0 [&_svg]:block [&_svg]:h-full [&_svg]:w-full [&_svg]:max-w-none"
            [class.opacity-40]="loading()"
            [innerHTML]="svg"
          ></div>
        } @else {
          <div class="absolute inset-0 animate-pulse bg-[#eef6f4]"></div>
        }
      </div>
    </div>
    <button
      type="button"
      (click)="reload()"
      [disabled]="loading()"
      [attr.aria-label]="'auth.captchaRefresh' | translate"
      class="flex h-12 w-12 shrink-0 cursor-pointer items-center justify-center rounded-full bg-(--mat-sys-primary) text-white shadow-sm transition-colors hover:bg-[#0b5e57] disabled:cursor-default disabled:opacity-50"
    >
      <svg
        viewBox="0 0 24 24"
        width="24"
        height="24"
        fill="currentColor"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
        />
      </svg>
    </button>
  </div>

  <mat-form-field [appearance]="'outline'" class="w-full">
    <mat-label>{{ "auth.captchaLabel" | translate }}</mat-label>
    <input
      matInput
      #captchaField="matInput"
      [value]="code()"
      (input)="onCodeInput($event)"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="characters"
      spellcheck="false"
      maxlength="8"
      name="captcha"
      [errorStateMatcher]="errorState"
    />
    <mat-error>
      @if (loadFailed()) {
        {{ "pleaseTryLater" | translate }}
      } @else if (serverInvalid()) {
        {{ "auth.captchaInvalid" | translate }}
      } @else if (missing()) {
        {{ "auth.captchaRequired" | translate }}
      }
    </mat-error>
  </mat-form-field>
</div>
