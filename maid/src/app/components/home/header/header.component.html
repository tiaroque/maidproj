<!-- bg-(--mat-sys-background) backdrop-blur-sm-->
<header
  id="header"
  class="bg-[#0f2a2e] fixed top-0 z-30 w-full text-white shadow-lg"
>
  <div
    class="md:max-w-6xl flex flex-wrap items-center justify-between w-full py-3 mx-auto mt-0 px-2"
  >
    <div class="flex items-center pl-4">
      <a
        class="flex items-center text-2xl font-bold text-[#7fd8c3] no-underline hover:no-underline lg:text-4xl"
        [routerLink]="['/', lang()]"
      >
        <span class="logo-mark mr-2 h-9 w-9" aria-hidden="true"></span>
        <div class="font-[Albert_Sans,sans-serif] font-semibold tracking-tighter">
          linpura
        </div>
      </a>
    </div>

    <div class="block pr-4 lg:hidden">
      <button
        (click)="openMobileMenu()"
        id="nav-toggle"
        type="button"
        [attr.aria-label]="'header.openMenu' | translate"
        class="flex items-center px-3 py-2 text-[#7fd8c3] border border-[#7fd8c3]/40 rounded appearance-none hover:border-[#7fd8c3] hover:cursor-pointer focus:outline-none"
      >
        <svg
          class="w-3 h-3 fill-current"
          viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z"></path>
        </svg>
      </button>
    </div>

    <!-- Menu Links -->
    <nav
      class="z-20 flex-grow hidden w-full p-4 mt-2 text-black lg:flex lg:items-center lg:w-auto lg:mt-0 lg:bg-transparent lg:p-0 bg-[#f6fbfa]"
      id="nav-content"
    >
      <ul class="items-center justify-end flex-1 list-reset lg:flex">
        <li class="mr-3">
          <a
            class="inline-block px-4 py-2 no-underline lg:text-white/90 hover:text-[#7fd8c3]"
            [routerLink]="['/', lang(), 'browse']"
            >{{ "header.browse" | translate }}</a
          >
        </li>
        <li class="mr-3">
          <a
            class="inline-block px-4 py-2 no-underline lg:text-white/90 hover:text-[#7fd8c3]"
            [routerLink]="['/', lang(), 'register']"
            >{{ "auth.register" | translate }}</a
          >
        </li>
      </ul>
      <a
        id="navAction"
        [routerLink]="['/', lang(), 'login']"
        class="inline-block px-7 py-3 mx-auto mt-4 cursor-pointer font-bold rounded-full shadow lg:mx-0 lg:mt-0 bg-[#0f9488] text-white hover:brightness-110"
      >
        {{ "auth.doYourLogin" | translate }}
      </a>
    </nav>
  </div>
</header>
