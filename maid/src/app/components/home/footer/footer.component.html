<footer class="border-t border-[#155e63]/10 bg-white/70 pt-10 pb-6">
  <div class="mx-auto w-full max-w-6xl px-8">
    <div
      class="flex flex-col gap-8 md:flex-row md:justify-between md:gap-10"
    >
      <div class="max-w-xs">
        <a
          class="flex items-center text-2xl font-bold text-[#155e63] no-underline hover:no-underline lg:text-3xl"
          [routerLink]="['/', lang()]"
        >
          <span class="logo-mark mr-2 h-9 w-9" aria-hidden="true"></span>
          <span class="font-[Albert_Sans,sans-serif] font-semibold tracking-tighter">
            linpura
          </span>
        </a>
        <p class="mt-3 text-sm leading-relaxed text-[#12292c]/70">
          {{ "auth.heroLine" | translate }}
        </p>
        <div class="mt-4 flex items-center gap-2">
        <a
          href="https://www.facebook.com/people/Linpura/61595661271521/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Linpura on Facebook"
          title="Facebook"
          class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-[#155e63]/10 text-[#155e63] no-underline transition-colors hover:bg-[#155e63] hover:text-white hover:no-underline"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M13.5 21v-7.5h2.53l.38-2.94H13.5V8.69c0-.85.24-1.43 1.46-1.43h1.56V4.63a20.9 20.9 0 0 0-2.27-.12c-2.25 0-3.79 1.37-3.79 3.89v2.17H7.92v2.94h2.54V21h3.04Z"
            />
          </svg>
        </a>
        <a
          href="https://www.instagram.com/linpura_cleaning/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Linpura on Instagram"
          title="Instagram"
          class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-[#155e63]/10 text-[#155e63] no-underline transition-colors hover:bg-[#155e63] hover:text-white hover:no-underline"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" />
          </svg>
        </a>
        <a
          href="https://www.linkedin.com/company/linpura/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Linpura on LinkedIn"
          title="LinkedIn"
          class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-[#155e63]/10 text-[#155e63] no-underline transition-colors hover:bg-[#155e63] hover:text-white hover:no-underline"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M6.94 8.5H3.56V20h3.38V8.5ZM5.25 3a1.96 1.96 0 1 0 0 3.92 1.96 1.96 0 0 0 0-3.92ZM20.44 13.4c0-3.1-1.66-4.54-3.87-4.54a3.34 3.34 0 0 0-3.02 1.66V8.5h-3.37V20h3.37v-5.7c0-1.5.29-2.95 2.14-2.95 1.83 0 1.85 1.71 1.85 3.05V20h3.44V13.4Z"
            />
          </svg>
        </a>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-8 sm:grid-cols-3 md:gap-12">
        <div>
          <p
            class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-[#155e63]/80"
          >
            {{ "footer.legal" | translate }}
          </p>
          <ul class="list-reset space-y-2">
            <li>
              <a
                [routerLink]="['/', lang(), 'terms-conditions']"
                class="text-sm text-[#12292c]/80 no-underline hover:text-[#0f766e] hover:underline"
                >{{ "footer.terms" | translate }}</a
              >
            </li>
            <li>
              <a
                [routerLink]="['/', lang(), 'privacy']"
                class="text-sm text-[#12292c]/80 no-underline hover:text-[#0f766e] hover:underline"
                >{{ "footer.privacy" | translate }}</a
              >
            </li>
          </ul>
        </div>

        <div>
          <p
            class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-[#155e63]/80"
          >
            {{ "footer.cookies" | translate }}
          </p>
          <ul class="list-reset space-y-2">
            <li>
              <button
                type="button"
                (click)="openCookiePrefs()"
                class="cursor-pointer text-sm text-[#12292c]/80 no-underline hover:text-[#0f766e] hover:underline"
              >
                {{ "footer.manageCookies" | translate }}
              </button>
            </li>
          </ul>
        </div>

        <div>
          <p
            class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-[#155e63]/80"
          >
            {{ "footer.company" | translate }}
          </p>
          <ul class="list-reset space-y-2">
            <li>
              <button
                type="button"
                (click)="showDialog()"
                aria-haspopup="dialog"
                class="cursor-pointer text-sm text-[#12292c]/80 no-underline hover:text-[#0f766e] hover:underline"
              >
                {{ "footer.contact" | translate }}
              </button>
            </li>
            <li>
              <a
                [routerLink]="['/', lang(), 'browse']"
                class="text-sm text-[#12292c]/80 no-underline hover:text-[#0f766e] hover:underline"
                >{{ "header.browse" | translate }}</a
              >
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div
      class="mt-10 flex flex-col items-center gap-3 border-t border-[#155e63]/10 pt-5"
    >
      <app-language-links />
      <p class="text-xs text-[#12292c]/70">© 2026 Linpura.</p>
    </div>
  </div>
</footer>
