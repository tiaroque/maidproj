<footer class="border-t border-[#155e63]/10 bg-white/70 pt-10 pb-6">
  <div class="mx-auto w-full max-w-6xl px-8">
    <div
      class="flex flex-col gap-8 md:flex-row md:justify-between md:gap-10"
    >
      <div class="max-w-xs">
        <a
          class="flex items-center text-2xl font-bold text-[#155e63] no-underline hover:no-underline lg:text-3xl"
          [routerLink]="['/', lang()]"
        >
          <span class="logo-mark mr-2 h-9 w-9" aria-hidden="true"></span>
          <span class="font-[Albert_Sans,sans-serif] font-semibold tracking-tighter">
            linpura
          </span>
        </a>
        <p class="mt-3 text-sm leading-relaxed text-[#12292c]/70">
          {{ "auth.heroLine" | translate }}
        </p>
      </div>

      <div class="grid grid-cols-2 gap-8 sm:grid-cols-3 md:gap-12">
        <div>
          <p
            class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-[#155e63]/80"
          >
            {{ "footer.legal" | translate }}
          </p>
          <ul class="list-reset space-y-2">
            <li>
              <a
                [routerLink]="['/', lang(), 'terms-conditions']"
                class="text-sm text-[#12292c]/80 no-underline hover:text-[#0f766e] hover:underline"
                >{{ "footer.terms" | translate }}</a
              >
            </li>
            <li>
              <a
                [routerLink]="['/', lang(), 'privacy']"
                class="text-sm text-[#12292c]/80 no-underline hover:text-[#0f766e] hover:underline"
                >{{ "footer.privacy" | translate }}</a
              >
            </li>
          </ul>
        </div>

        <div>
          <p
            class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-[#155e63]/80"
          >
            {{ "footer.cookies" | translate }}
          </p>
          <ul class="list-reset space-y-2">
            <li>
              <button
                type="button"
                (click)="openCookiePrefs()"
                class="cursor-pointer text-sm text-[#12292c]/80 no-underline hover:text-[#0f766e] hover:underline"
              >
                {{ "footer.manageCookies" | translate }}
              </button>
            </li>
          </ul>
        </div>

        <div>
          <p
            class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-[#155e63]/80"
          >
            {{ "footer.company" | translate }}
          </p>
          <ul class="list-reset space-y-2">
            <li>
              <button
                type="button"
                (click)="showDialog()"
                aria-haspopup="dialog"
                class="cursor-pointer text-sm text-[#12292c]/80 no-underline hover:text-[#0f766e] hover:underline"
              >
                {{ "footer.contact" | translate }}
              </button>
            </li>
            <li>
              <a
                [routerLink]="['/', lang(), 'browse']"
                class="text-sm text-[#12292c]/80 no-underline hover:text-[#0f766e] hover:underline"
                >{{ "header.browse" | translate }}</a
              >
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div
      class="mt-10 flex flex-col items-center gap-3 border-t border-[#155e63]/10 pt-5"
    >
      <app-language-links />
      <p class="text-xs text-[#12292c]/70">© 2026 Linpura.</p>
    </div>
  </div>
</footer>
