<div
  role="status"
  class="animate-pulse px-4 sm:px-6 lg:px-8 pt-2 pb-12 grid grid-cols-2 gap-4 md:grid-cols-3 md:gap-6 lg:grid-cols-4"
>
  @for (num of array(); track num) {
    <div
      class="relative aspect-3/4 overflow-hidden rounded-2xl border border-[#7fd8c3]/20 bg-[#0f2a2e]"
    >
      <div class="flex h-full items-center justify-center">
        <svg
          class="h-2/3 w-2/3 text-white/30"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="currentColor"
          viewBox="0 0 448 512"
        >
          <use href="assets/images/user-solid.svg#Capa_1"></use>
        </svg>
      </div>
      <div class="absolute inset-x-0 bottom-0 space-y-2 p-4">
        <div class="h-5 w-2/3 rounded-full bg-white/20"></div>
        <div class="h-3 w-1/2 rounded-full bg-white/15"></div>
      </div>
      <span class="sr-only">Loading...</span>
    </div>
  }
</div>
