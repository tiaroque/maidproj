<div>
  <div
    class="flex flex-row-reverse md:flex-row md:justify-start items-center px-4 md:px-0"
  >
    <div class="mx-2">
      <h3 [attr.user-id]="userId" class="body-2">
        @if (formatName()) {
          {{ name.length > 9 ? (name | slice: 0 : 9) + "..." : name }}
        } @else {
          {{ name }}
        }
      </h3>
      <!-- <p>{{ userId }}</p> -->
    </div>

    @if (!profilePhotoLocation()) {
      <div class="w-10">
        <app-profile-avatar [user]="storeChat.me().user" />
      </div>
    }

    @if (profilePhotoLocation()) {
      <div class="relative w-10 h-10 shrink-0">
        <img
          alt=""
          [ngSrc]="profilePhotoLocation()!"
          fill
          class="profile-img-border object-cover"
        />
      </div>
    }
  </div>
</div>
