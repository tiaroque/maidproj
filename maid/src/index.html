<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Linpura — Find a trusted cleaner near you.</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=2,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Compare verified cleaners by service, hourly rate and availability, then agree the details in a private chat."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Linpura" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Linpura — Find a trusted cleaner near you."
    />
    <meta
      property="og:description"
      content="Compare verified cleaners by service, hourly rate and availability, then agree the details in a private chat."
    />
    <meta
      property="og:image"
      content="https://www.linpura.com/assets/images/og/og-en.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://www.linpura.com/assets/images/og/og-en.jpg"
    />
    <meta name="theme-color" content="#0f2a2e" />

    <link
      rel="preconnect"
      href="https://maid-bucket.s3.eu-west-3.amazonaws.com"
      crossorigin
    />

    <link
      rel="preload"
      href="/assets/fonts/nunito-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Link-preview crawlers and older browsers skip SVG icons and fall back
         to the .ico or the PNGs, so all three must show the mop. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link
      rel="icon"
      href="/assets/images/favicon-mop.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="/assets/images/icons/icon-192.png"
      type="image/png"
      sizes="192x192"
    />
    <link
      rel="apple-touch-icon"
      href="/assets/images/icons/apple-touch-icon.png"
    />
  </head>
  <!-- Heights stay relative to the layout viewport. A dvh floor would hold the
       page at full screen height when the soft keyboard shrinks it. -->
  <body
    id="body-maid"
    class="mat-typography h-full bg-(--mat-sys-background) text-(--mat-sys-on-surface)"
  >
    <app-root></app-root>
  </body>
</html>
