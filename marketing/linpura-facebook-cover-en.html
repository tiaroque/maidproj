<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Linpura — Facebook cover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1640px;
        height: 624px;
        overflow: hidden;
        background: #071c20;
      }

      .cover {
        position: relative;
        width: 1640px;
        height: 624px;
        padding: 52px 88px 64px 300px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 56px;
        color: #f4fbf9;
        font-family: Nunito, sans-serif;
        background:
          radial-gradient(
            900px 520px at 0% 0%,
            rgba(127, 216, 195, 0.26),
            transparent 58%
          ),
          radial-gradient(
            760px 480px at 100% 120%,
            rgba(15, 118, 110, 0.55),
            transparent 55%
          ),
          linear-gradient(168deg, #16484d 0%, #0d3337 48%, #071c20 100%);
        overflow: hidden;
      }

      .cover::before,
      .cover::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        border: 2px solid rgba(127, 216, 195, 0.16);
      }

      .cover::before {
        width: 520px;
        height: 520px;
        right: -140px;
        top: -220px;
      }

      .cover::after {
        width: 340px;
        height: 340px;
        right: -20px;
        top: -90px;
        border-color: rgba(127, 216, 195, 0.1);
      }

      .copy,
      .side {
        position: relative;
        z-index: 1;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        color: #7fd8c3;
      }

      .broom {
        width: 52px;
        height: 52px;
        fill: currentColor;
        flex-shrink: 0;
      }

      .wordmark {
        font-family: "Albert Sans", Nunito, sans-serif;
        font-weight: 600;
        font-size: 46px;
        letter-spacing: -0.05em;
        line-height: 1;
      }

      h1 {
        margin-top: 14px;
        max-width: none;
        font-size: 42px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }

      .audience {
        margin-top: 16px;
        color: #7fd8c3;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .audience-lead {
        margin-top: 8px;
        max-width: 720px;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.3;
        color: rgba(244, 251, 249, 0.88);
      }

      .copy {
        flex: 1;
        min-width: 0;
      }

      .facts {
        margin-top: 22px;
        display: flex;
        gap: 12px;
      }

      .fact {
        flex: 1;
        min-width: 0;
        padding: 12px 16px 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.06);
        border: 1.5px solid rgba(127, 216, 195, 0.28);
      }

      .fact strong {
        display: block;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      .fact span {
        display: block;
        margin-top: 4px;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.25;
        white-space: nowrap;
        color: rgba(244, 251, 249, 0.74);
      }

      .side {
        flex-shrink: 0;
        width: 230px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .pill {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #08332f;
        background: #7fd8c3;
        border-radius: 999px;
        padding: 10px 18px;
      }

      .url {
        font-family: "Albert Sans", Nunito, sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #f4fbf9;
      }

    </style>
  </head>
  <body>
    <article class="cover">
      <div class="copy">
        <div class="brand">
          <svg class="broom" viewBox="0 0 64 64" aria-hidden="true">
            <g transform="rotate(15 32 32) translate(0 -3)">
              <rect x="30" y="3" width="4" height="27" rx="2" />
              <path d="M23 28h18l3 9H20z" />
              <path d="M20.5 36h5l-7 18a3.5 3.5 0 0 1-7 0z" />
              <path d="M25 36h5l-2.5 21a3.5 3.5 0 0 1-7 0z" />
              <path d="M29.5 36h5l1 22a3.5 3.5 0 0 1-7 0z" />
              <path d="M34 36h5l4.5 21a3.5 3.5 0 0 1-7 0z" />
              <path d="M38.5 36h5l8.5 18a3.5 3.5 0 0 1-7 0z" />
            </g>
          </svg>
          <div class="wordmark">linpura</div>
        </div>
        <h1>Find a cleaner near you.</h1>
        <p class="audience">For independent professionals</p>
        <p class="audience-lead">
          Set your rate, your area and the services you accept.
        </p>
        <div class="facts">
          <div class="fact">
            <strong>Hourly rate</strong>
            <span>On the profile, no surprises</span>
          </div>
          <div class="fact">
            <strong>Private chat</strong>
            <span>Agree before the visit</span>
          </div>
          <div class="fact">
            <strong>Availability</strong>
            <span>Days and times on the profile</span>
          </div>
          <div class="fact">
            <strong>Your area</strong>
            <span>Cleaners near you</span>
          </div>
        </div>
      </div>
      <div class="side">
        <div class="pill">Completely free</div>
        <div class="url">linpura.com</div>
      </div>
    </article>
  </body>
</html>
